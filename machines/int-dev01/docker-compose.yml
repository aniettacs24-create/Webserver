# VulnCorp — Machine 9: int-dev01
# DEPLOY: git clone <repo> && cd int-dev01 && sudo ./deploy.sh
# ACCESS: http://<VM_IP>        (GitLab — root/gitlab_root_pass)
#         http://<VM_IP>:8080   (Jenkins — no auth)
#         curl http://<VM_IP>:2375/version  (Docker API — no TLS!)
#         ssh developer@<VM_IP> -p 2222     (developer/dev123)
# ⚠️  FOR EDUCATIONAL / LAB USE ONLY
services:
  int-dev01:
    build: .
    container_name: vulncorp-dev01
    hostname: vulncorp-dev01
    privileged: true
    ports:
      - "0.0.0.0:2222:22"       # SSH (host 2222 → container 22, avoids host :22 conflict)
      - "0.0.0.0:80:80"         # GitLab HTTP
      - "0.0.0.0:2375:2375"     # Docker API (no TLS!)
      - "0.0.0.0:8080:8080"     # Jenkins
    volumes:
      # Mount host Docker socket so the exposed API also controls the host daemon
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped
    environment:
      - VULNCORP_ENV=lab
      - MACHINE_IP=192.168.1.30
    # Healthcheck: verifies that SSH is up (fastest indicator that entrypoint ran)
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "22"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

