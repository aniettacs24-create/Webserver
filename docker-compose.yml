version: '3.8'

# ================================================================
# VulnCorp Vulnerable Lab — Docker Compose
# ================================================================
# USAGE:
#   docker compose build
#   docker compose up -d
#
# EXTERNAL ACCESS (choose one):
#
#   Option A — ngrok tunnels (internet-wide):
#     ./tunnel.sh start          (or run deploy.sh for full setup)
#
#   Option B — LAN access (same network):
#     Access via your server's IP: http://<SERVER_IP>:8080
#
#   Option C — ngrok as Docker sidecar:
#     NGROK_AUTHTOKEN=xxx docker compose --profile tunnel up -d
#
# ACCESS:
#   Web:  http://<SERVER_IP>:8080    (or ngrok URL)
#   SSH:  ssh webuser@<SERVER_IP> -p 2222   (password: webuser123)
#   FTP:  ftp <SERVER_IP> 2121              (anonymous login enabled)
#
# ⚠️  FOR EDUCATIONAL / LAB USE ONLY — DO NOT EXPOSE TO THE INTERNET
# ================================================================

services:
  vulncorp:
    build: .
    container_name: vulncorp-server
    hostname: vulncorp-web01
    ports:
      - "0.0.0.0:8080:80"     # Web Application — accessible on all interfaces
      - "0.0.0.0:2222:22"     # SSH
      - "0.0.0.0:2121:21"     # FTP
      - "0.0.0.0:40000-40100:40000-40100"  # FTP passive ports
    cap_add:
      - SYS_PTRACE     # Allow debugging (for some exploits)
    security_opt:
      - seccomp:unconfined  # Looser security for lab
    restart: unless-stopped
    environment:
      - VULNCORP_ENV=lab
      - MACHINE2_IP=192.168.56.102
    networks:
      - vulncorp-net

  # ── Optional: ngrok tunnel as a Docker sidecar ──────────────────
  # Activate with: docker compose --profile tunnel up -d
  # Requires NGROK_AUTHTOKEN environment variable
  ngrok:
    image: ngrok/ngrok:latest
    container_name: vulncorp-ngrok
    profiles:
      - tunnel
    restart: unless-stopped
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command:
      - "start"
      - "--all"
      - "--config"
      - "/etc/ngrok.yml"
    volumes:
      - ./ngrok-docker.yml:/etc/ngrok.yml:ro
    ports:
      - "0.0.0.0:4040:4040"   # ngrok web dashboard
    depends_on:
      - vulncorp
    networks:
      - vulncorp-net

networks:
  vulncorp-net:
    driver: bridge
